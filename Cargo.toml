[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/daeken/OpenThedas"
rust-version = "1.85"

[workspace.dependencies]
thedas-vfs = { path = "crates/thedas-vfs" }
thedas-formats = { path = "crates/thedas-formats" }
thedas-render = { path = "crates/thedas-render" }
thedas-shader = { path = "crates/thedas-shader" }
thedas-script = { path = "crates/thedas-script" }
thedas-sim = { path = "crates/thedas-sim" }
thiserror = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
blowfish = "0.9"
md-5 = "0.10"
crc32fast = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
roxmltree = "0.21"
wgpu = "30"
naga = { version = "30", features = ["wgsl-in"] }
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
png = "0.18"
log = "0.4"
env_logger = "0.11"

[profile.release]
debug = 1
