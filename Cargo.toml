[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/daeken/OpenThedas"
rust-version = "1.85"

[workspace.dependencies]
thedas-vfs = { path = "crates/thedas-vfs" }
thedas-formats = { path = "crates/thedas-formats" }
thiserror = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
blowfish = "0.9"
md-5 = "0.10"
crc32fast = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
roxmltree = "0.21"

[profile.release]
debug = 1
