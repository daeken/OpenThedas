[package]
name = "thedas-app"
description = "OpenThedas application: window, input and frame loop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "thedas-app"
path = "src/main.rs"

[dependencies]
thedas-vfs.workspace = true
thedas-formats.workspace = true
thedas-render.workspace = true
thedas-ui.workspace = true
thedas-sim.workspace = true
thedas-script.workspace = true
thedas-audio = { workspace = true, features = ["device"] }
thedas-video.workspace = true
anyhow.workspace = true
clap.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
glam.workspace = true
bytemuck.workspace = true
png.workspace = true
texpresso.workspace = true
log.workspace = true
env_logger.workspace = true
serde_json.workspace = true
serde.workspace = true
base64 = "0.23"
gilrs = "0.11"
dirs = "6"
flate2.workspace = true
ureq = "3"
sha2 = "0.11"
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false, features = ["accesskit"] }
thedas-launcher.workspace = true
thedas-store.workspace = true
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }

[build-dependencies]
embed-resource = "3"
