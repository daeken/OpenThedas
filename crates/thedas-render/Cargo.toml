[package]
name = "thedas-render"
description = "wgpu renderer for Dragon Age: Origins areas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thedas-vfs.workspace = true
thedas-formats.workspace = true
thedas-shader.workspace = true
naga.workspace = true
thiserror.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
log.workspace = true
pollster.workspace = true

[dev-dependencies]
# Every backend's shader translation, to check the hand-written shaders against them (see
# `thedas_shader::backends`).
thedas-shader = { workspace = true, features = ["backend-check"] }
